<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./scripts/profile.js"></script>
    <link rel="stylesheet" href="./style/profile.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>פרופיל</h1>
        <div class="profile">
            <div class="box">
                <img id="profile_pic" src="" alt="">
                <div class="details">
                    <h2 id="fullname"></h2>
                    <h4 id="email"></h4>
                    <h4 id="address"></h4>
                    <h4 id="birthday"></h4>
                </div>
            </div>
            <div class="box buttons">
                <button id="Update_details">עדכון פרטים</button>
                <button id="Game">למשחק</button>
                <button id="Logout">התנתק</button>
            </div>
        </div>
    </div>
</body>
</html>
